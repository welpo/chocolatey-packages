name: Test packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to test"
        required: true
        default: all
        type: choice
        options:
          - all
          - git-sumi
          - shuku
          - zola

defaults:
  run:
    shell: pwsh

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select packages to test
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          else
            changed=$(ls -d */)
          fi
          packages=$(printf '%s\n' "$changed" | cut -d/ -f1 | sort -u \
            | jq -Rsc 'split("\n") | map(select(test("^(git-sumi|shuku|zola)$")))')
          echo "Testing: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.package }}
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.select.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from nuspec
        id: nuspec
        run: |
          [xml]$nuspec = Get-Content "${{ matrix.package }}/${{ matrix.package }}.nuspec"
          $version = $nuspec.package.metadata.version
          if (-not $version) { throw "no version in ${{ matrix.package }}.nuspec" }
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack
        run: choco pack "${{ matrix.package }}/${{ matrix.package }}.nuspec" --outputdirectory .

      - name: Install
        run: choco install "${{ matrix.package }}" --version="${{ steps.nuspec.outputs.version }}" --source="$PWD;https://community.chocolatey.org/api/v2/" -y --no-progress

      - name: Test
        run: ./${{ matrix.package }}/test.ps1 -ExpectedVersion "${{ steps.nuspec.outputs.version }}"

      - name: Uninstall
        run: choco uninstall "${{ matrix.package }}" -y
